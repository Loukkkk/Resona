name: Build and Release

on:
  push:
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10
  workflow_dispatch: # Allows manual trigger

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Publish the application
      run: |
        dotnet publish src/Resona.csproj -c Release -p:Platform=x64 -r win-x64

    - name: Locate publish directory
      shell: pwsh
      run: |
        $publishDir = "src\obj\x64\Release\net10.0-windows10.0.19041.0\win-x64\PubTmp\Out"
        # Fallback if standard publish directory is used
        if (-not (Test-Path $publishDir)) {
            $publishDir = "src\bin\x64\Release\net10.0-windows10.0.19041.0\win-x64\publish"
        }
        if (-not (Test-Path $publishDir)) {
            $publishDir = "src\bin\Release\net10.0-windows10.0.19041.0\win-x64\publish"
        }
        if (-not (Test-Path $publishDir)) {
            throw "Publish directory not found"
        }
        $fullPath = (Resolve-Path $publishDir).Path
        "PUBLISH_DIR=$fullPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Create Zip Archive
      shell: pwsh
      run: |
        Compress-Archive -Path "$env:PUBLISH_DIR\*" -DestinationPath "Resona-${{ github.ref_name }}-win-x64.zip" -Force

    - name: Install Inno Setup
      shell: pwsh
      run: |
        choco install innosetup --no-progress -y

    - name: Build installer (Setup.exe)
      shell: pwsh
      run: |
        # Version lue dans le .csproj pour que l'installateur affiche la meme que l'application
        [xml]$proj = Get-Content src/Resona.csproj
        $version = ($proj.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
        $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
        & $iscc "/DAppVersion=$version" "/DSourceDir=$env:PUBLISH_DIR" "/DOutputName=Resona-${{ github.ref_name }}-win-x64-Setup" "installer\Resona.iss"
        if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed" }

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          Resona-${{ github.ref_name }}-win-x64.zip
          installer/output/Resona-${{ github.ref_name }}-win-x64-Setup.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
