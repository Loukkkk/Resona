name: Build and Release

on:
  push:
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10
  workflow_dispatch: # Allows manual trigger

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Publish the application
      run: |
        dotnet publish src/Resona.csproj -c Release -p:Platform=x64 -r win-x64

    - name: Create Zip Archive
      run: |
        $publishDir = "src\obj\x64\Release\net8.0-windows10.0.19041.0\win-x64\PubTmp\Out"
        # Fallback if standard publish directory is used
        if (-not (Test-Path $publishDir)) {
            $publishDir = "src\bin\x64\Release\net8.0-windows10.0.19041.0\win-x64\publish"
        }
        if (-not (Test-Path $publishDir)) {
            $publishDir = "src\bin\Release\net8.0-windows10.0.19041.0\win-x64\publish"
        }
        Compress-Archive -Path "$publishDir\*" -DestinationPath "Resona-${{ github.ref_name }}-win-x64.zip" -Force

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: Resona-${{ github.ref_name }}-win-x64.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
